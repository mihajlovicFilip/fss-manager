<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontrolna tabla · Fudokan savez Srbije</title>
<meta name="theme-color" content="#5980a6">
<!-- Cache name this page expects; must match CACHE in sw.js. -->
<meta name="app-cache" content="fss-manager-v65">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">

<!-- Nothing on this page touches the network: fonts are local and the
     service worker caches the rest. -->
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/industry.css">
<link rel="stylesheet" href="assets/css/app.css">
<!-- Paper for the Štampaj button — the same sheet documents.html prints. -->
<link rel="stylesheet" href="assets/css/doc-sheet.css">
</head>
<body>

<div class="app" id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" hidden></div>

<!-- Classic script, so <doc-page> registers before the module starts. -->
<script src="assets/js/doc-page.js"></script>
<script type="module" src="assets/js/app.js"></script>

<script>
  // Registers the offline cache. Needs a secure context, so it does
  // nothing over file:// — use start.command.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      // updateViaCache: 'none' — sw.js itself is never taken from the HTTP
      // cache, or a refreshed folder can keep serving an old build for days.
      // update() forces the check on every open.
      //
      // First check that the stored cache belongs to this version. The page
      // itself always arrives fresh from the server, so its meta tag is the
      // truth: a cache under any other name is an older build, so it is
      // deleted together with the worker and the page reloads once.
      const wantedCache = document.querySelector('meta[name="app-cache"]')?.content;
      if (wantedCache && window.caches) {
        caches.keys().then(async (keys) => {
          if (!keys.length || keys.includes(wantedCache)) return;
          console.warn('Zatečen stariji keš (' + keys.join(', ') + ') — čistim ga.');
          await Promise.all(keys.map((k) => caches.delete(k)));
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
          location.reload();
        }).catch(() => { /* no cache, nothing to clean up */ });
      }

      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then((reg) => reg.update())
        .catch((err) => {
          console.warn('Offline keš nije registrovan:', err.message);
        });

      // When a new version takes over, the page reloads once — otherwise
      // the old build stays on screen until the next visit.
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloaded) return;
        reloaded = true;
        location.reload();
      });
    });
  }
</script>
</body>
</html>
